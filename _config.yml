# Chen Chen — Academic Pages personal website
# Based on https://github.com/academicpages/academicpages.github.io
# The upstream theme is pinned for reproducible builds.
remote_theme: "academicpages/academicpages.github.io@a4386d88512a52499f4cebff515a1bb9b310da9a"

locale: "en-US"
site_theme: "default"

title: "Chen Chen"
title_separator: "-"
name: &name "Chen Chen"
description: &description "Robotics engineer working on real-world robotic systems, control, and system integration."
url: "https://fjiwrogno.github.io"
baseurl: ""
repository: "fjiwrogno/fjiwrogno.github.io"

author:
  avatar: "avatar.jpg"
  name: "Chen Chen"
  bio: "Robotics engineer | Real-world robotic systems, control, and system integration"
  location: "Tokyo, Japan"
  employer: "The University of Tokyo"
  uri:
  email: "chenchen7464@gmail.com"

  academia:
  arxiv:
  googlescholar:
  orcid:
  researchgate:

  github: "fjiwrogno"
  linkedin:
  twitter:
  instagram:
  youtube:

publication_category:
  conferences:
    title: "Conference Papers & Presentations"

teaser:
breadcrumbs: false
words_per_minute: 180
future: true
read_more: "enabled"

comments:
  provider:

atom_feed:
  hide: false

analytics:
  provider: "false"

include:
  - _pages
  - files

exclude:
  - .bundle
  - .github
  - .jekyll-cache
  - .sass-cache
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - SITE_EDITING_GUIDE.md

keep_files:
  - .git

encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"
markdown: kramdown
highlighter: rouge
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo

collections:
  publications:
    output: true
    permalink: /publication/:path/
  portfolio:
    output: true
    permalink: /portfolio/:path/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: true
      related: true

  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: true
      comments: false

  - scope:
      path: ""
      type: portfolio
    values:
      layout: single
      author_profile: true
      share: true
      comments: false

sass:
  sass_dir: _sass
  style: compressed

permalink: /blog/:year/:month/:day/:title/
timezone: Asia/Tokyo

plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

whitelist:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

compress_html:
  clippings: all
  ignore:
    envs: development
